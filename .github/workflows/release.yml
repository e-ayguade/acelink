name: Release

# Push a version tag (e.g. 2.2.0) to build the app and publish a release with the .dmg.
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check VERSION matches the tag
        run: |
          if [ "$(cat VERSION)" != "$TAG" ]; then
            echo "VERSION is $(cat VERSION) but the tag is $TAG" >&2
            exit 1
          fi

      - name: Build universal app
        run: ARCHS="arm64 x86_64" scripts/build-app.sh

      - name: Make DMG
        run: scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="build/Ace.Link.$TAG.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "Ace Link $TAG" --generate-notes
          fi
